# The real neo-07 persistence model from the v5 card-account-setup briefs.
#
# No application payload columns belong here. application_id is the only applicant-linked
# value stored by this module. The catalogue seed is deliberately separate and pending the
# exact three locked product definitions; see docs/contract-and-data-decisions.md.
databaseChangeLog:
  - changeSet:
      id: 002-create-account-domain
      author: neo-07
      changes:
        - createTable:
            tableName: core_config
            columns:
              - column:
                  name: version
                  type: INT
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: retry_budget
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: timeout_ms
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: core_base_url
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: catalogue
                  type: JSON
                  constraints:
                    nullable: false
              - column:
                  name: effective_from
                  type: TIMESTAMP(6)
                  defaultValueComputed: CURRENT_TIMESTAMP(6)
                  constraints:
                    nullable: false

        - createTable:
            tableName: account_record
            columns:
              - column:
                  name: application_id
                  type: VARCHAR(64)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: reference
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: outcome
                  type: VARCHAR(20)
                  defaultValue: IN_PROGRESS
                  constraints:
                    nullable: false
              - column:
                  name: reason_code
                  type: VARCHAR(50)
              - column:
                  name: account_id
                  type: VARCHAR(64)
              - column:
                  name: credit_amount
                  type: INT
              - column:
                  name: credit_amount_fallback
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: agreement_id
                  type: VARCHAR(64)
              - column:
                  name: product_code
                  type: VARCHAR(64)
              - column:
                  name: product_version
                  type: INT
              - column:
                  name: customer_id
                  type: VARCHAR(64)
              - column:
                  name: card_id
                  type: VARCHAR(64)
              - column:
                  name: core_config_version
                  type: INT
              - column:
                  name: created_at
                  type: TIMESTAMP(6)
                  defaultValueComputed: CURRENT_TIMESTAMP(6)
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP(6)
                  defaultValueComputed: CURRENT_TIMESTAMP(6)
                  constraints:
                    nullable: false
              - column:
                  name: opened_at
                  type: TIMESTAMP(6)

        - addUniqueConstraint:
            tableName: account_record
            columnNames: reference
            constraintName: uq_account_record_reference

        - addForeignKeyConstraint:
            constraintName: fk_account_record_config
            baseTableName: account_record
            baseColumnNames: core_config_version
            referencedTableName: core_config
            referencedColumnNames: version
            onDelete: RESTRICT
            onUpdate: RESTRICT

        - createIndex:
            tableName: account_record
            indexName: idx_account_record_outcome_created
            columns:
              - column:
                  name: outcome
              - column:
                  name: created_at

        - createIndex:
            tableName: account_record
            indexName: idx_account_record_config
            columns:
              - column:
                  name: core_config_version

        - createTable:
            tableName: core_attempt
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: application_id
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: cycle_no
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: kind
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: result
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
              - column:
                  name: core_reference
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: latency_ms
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: occurred_at
                  type: TIMESTAMP(6)
                  defaultValueComputed: CURRENT_TIMESTAMP(6)
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            constraintName: fk_core_attempt_account
            baseTableName: core_attempt
            baseColumnNames: application_id
            referencedTableName: account_record
            referencedColumnNames: application_id
            onDelete: RESTRICT
            onUpdate: RESTRICT

        - createIndex:
            tableName: core_attempt
            indexName: idx_core_attempt_case_time
            columns:
              - column:
                  name: application_id
              - column:
                  name: occurred_at
              - column:
                  name: id

        - createIndex:
            tableName: core_attempt
            indexName: idx_core_attempt_case_cycle
            columns:
              - column:
                  name: application_id
              - column:
                  name: cycle_no
              - column:
                  name: id

        - createTable:
            tableName: override_log
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: application_id
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: old_outcome
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: new_outcome
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: account_id
                  type: VARCHAR(64)
              - column:
                  name: reason
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  # "operator" is a keyword in some SQL tooling, so the physical name is explicit.
                  name: operator_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: overridden_at
                  type: TIMESTAMP(6)
                  defaultValueComputed: CURRENT_TIMESTAMP(6)
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            constraintName: fk_override_log_account
            baseTableName: override_log
            baseColumnNames: application_id
            referencedTableName: account_record
            referencedColumnNames: application_id
            onDelete: RESTRICT
            onUpdate: RESTRICT

        - createIndex:
            tableName: override_log
            indexName: idx_override_log_case_time
            columns:
              - column:
                  name: application_id
              - column:
                  name: overridden_at
              - column:
                  name: id

        - sql:
            sql: >-
              ALTER TABLE core_config
              ADD CONSTRAINT ck_core_config_version CHECK (version > 0);
              ALTER TABLE core_config
              ADD CONSTRAINT ck_core_config_retry_budget CHECK (retry_budget BETWEEN 1 AND 10);
              ALTER TABLE core_config
              ADD CONSTRAINT ck_core_config_timeout_ms CHECK (timeout_ms BETWEEN 200 AND 30000);
              ALTER TABLE account_record
              ADD CONSTRAINT ck_account_record_outcome
              CHECK (outcome IN ('IN_PROGRESS', 'OPENED', 'FAILED'));
              ALTER TABLE account_record
              ADD CONSTRAINT ck_account_record_reason
              CHECK (reason_code IS NULL OR reason_code IN
                ('ACC_OPENED', 'ACC_DUPLICATE_PREVENTED', 'ACC_CORE_UNAVAILABLE'));
              ALTER TABLE account_record
              ADD CONSTRAINT ck_account_record_credit_amount
              CHECK (credit_amount IS NULL OR credit_amount >= 0);
              ALTER TABLE account_record
              ADD CONSTRAINT ck_account_record_opened_has_account
              CHECK (outcome <> 'OPENED' OR account_id IS NOT NULL);
              ALTER TABLE core_attempt
              ADD CONSTRAINT ck_core_attempt_cycle CHECK (cycle_no > 0);
              ALTER TABLE core_attempt
              ADD CONSTRAINT ck_core_attempt_latency CHECK (latency_ms >= 0);
              ALTER TABLE core_attempt
              ADD CONSTRAINT ck_core_attempt_reference
              CHECK (core_reference = application_id);
              ALTER TABLE core_attempt
              ADD CONSTRAINT ck_core_attempt_kind_result
              CHECK (
                (kind = 'PROBE' AND result IN ('MISS', 'HIT', 'TIMEOUT', 'ERROR'))
                OR
                (kind = 'OPEN' AND result IN ('CREATED', 'TIMEOUT', 'ERROR'))
              );
              ALTER TABLE override_log
              ADD CONSTRAINT ck_override_log_old_outcome
              CHECK (old_outcome IN ('IN_PROGRESS', 'OPENED', 'FAILED'));
              ALTER TABLE override_log
              ADD CONSTRAINT ck_override_log_new_outcome
              CHECK (new_outcome IN ('OPENED', 'FAILED'));
              ALTER TABLE override_log
              ADD CONSTRAINT ck_override_log_changes_outcome
              CHECK (old_outcome <> new_outcome);
              ALTER TABLE override_log
              ADD CONSTRAINT ck_override_log_opened_has_account
              CHECK (new_outcome <> 'OPENED' OR account_id IS NOT NULL);

      rollback:
        - dropTable:
            tableName: override_log
        - dropTable:
            tableName: core_attempt
        - dropTable:
            tableName: account_record
        - dropTable:
            tableName: core_config
