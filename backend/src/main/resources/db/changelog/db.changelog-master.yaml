# Liquibase master changelog — this service owns its schema and nothing else's.
# Add one file per change set under changes/ and include it here in order.
# Never edit an already-applied change set; add a new one.
databaseChangeLog:
  - include:
      file: db/changelog/changes/001-create-demo-showcase.yaml
  - include:
      file: db/changelog/changes/002-create-account-domain.yaml
  - include:
      file: db/changelog/changes/003-normalize-account-fallback-boolean.yaml
  - include:
      file: db/changelog/changes/004-normalize-override-reason.yaml
  - include:
      file: db/changelog/changes/005-restore-domain-nullability.yaml
  - include:
      file: db/changelog/changes/006-enforce-mysql-fallback-definition.yaml
